# dsh-social 组合包的配置层。
#
# 和开发用的 ../cordis.yml 的区别：这里的 name 是**包名子路径**，不是绝对源码路径。
# 原因见官方「打包与安装插件」：patch 行按包名引用，Node 的模块解析才找得到
# 已安装的代码。绝对路径那种写法只在 --patch overlay 里用。
#
# 安装：
#   dsh plugin --profile web add /Users/derek/code/dsh-social/bundle
# 之后照常 `dsh web` 即可，不需要再带 --patch。
#
# 改了源码要重新生效：
#   pnpm run build:bundle
#   然后重启 dsh

- insert:
    # 联网 provider。想退回纯本地就把这段换成 social-local（见 README）。
    - id: social-cloud
      name: 'dsh-social-plugin/cloud'
      config:
        # 固定地址（cloudflare named tunnel → 作者本机）。重启不变。
        # 换服务端不用改这个文件 —— 设环境变量即可：
        #   export DSH_SOCIAL_ENDPOINT=https://你的地址
        # 想完全不联网就把这段换成 social-local（见 README）。
        endpoint: 'https://social.c01.link'
        timeoutMs: 10000

    # Consumer：观察对话、生成草稿。唯一消耗 token 的包
    - id: social-curator
      name: 'dsh-social-plugin/curator'
      config:
        # 打印每轮的字数/工具调用数/是否够格提议，卸载时打印事件类型直方图。
        # 日常用不想看日志就改成 false。
        probe: true
        # 只保留手动命令、完全不自动调模型：改成 true
        manualOnly: false
        # ⚠️ 把关注话题里别人的发言注入你的会话流。默认关闭。
        #
        #    打开它意味着接受三件事：
        #      ① 花 token —— 别人的话进 prompt，每轮都发
        #      ② AI 会接话 —— 它看得见，可能主动评论陌生人的观点
        #      ③ 别人的话落进你本机的会话日志，永久保留
        #
        #    设计文档第 7 节把「进模型上下文」划给了阶段 4 房间模式，
        #    这个开关就是那条线。详见 packages/curator/src/inject.ts。
        injectTopics: false

    # Consumer：用户动作。刻意不注册任何 tool
    - id: social-commands
      name: 'dsh-social-plugin/commands'

    # 宿主半：给浏览器的话题广场提供数据路由。
    #
    # ⚠️ 这一行必须用**裸包名**，不能写成 'dsh-social-plugin/web'。
    #    client 模块扫描器是按 loader entry 的名字去查包元数据的，
    #    子路径说明符（xxx/web）查不到包，于是 dsh.client 声明被当成
    #    「非 client 包」缓存掉，浏览器半永远不会被加载，而且**不报错**。
    #    包根的 exports 指向 dist/web.js，所以这行和 /web 是同一份代码。
    - id: social-web
      name: 'dsh-social-plugin'
